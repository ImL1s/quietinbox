name: Release

# Tag `vX.Y.Z` → signed release APK + AAB, permission gate, GitHub Release with checksums.
# Google Play uploads are deliberate: `workflow_dispatch` with a tag and a track (internal or
# production); the paid store listing never changes as a side effect of a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        type: choice
        options: [internal, production]
        default: internal
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QUIETINBOX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "QUIETINBOX_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "QUIETINBOX_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release APK and AAB
        env:
          QUIETINBOX_KEYSTORE_PASSWORD: ${{ secrets.QUIETINBOX_KEYSTORE_PASSWORD }}
          QUIETINBOX_KEY_ALIAS: ${{ secrets.QUIETINBOX_KEY_ALIAS }}
          QUIETINBOX_KEY_PASSWORD: ${{ secrets.QUIETINBOX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain test :app:assembleRelease :app:bundleRelease
      - name: No network permission in release APK
        run: tools/check-permissions.sh app/build/outputs/apk/release/app-release.apk
      - name: Name artifacts
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ -n "${{ inputs.tag }}" ] && VERSION="${{ inputs.tag }}" && VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/quietinbox-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/quietinbox-$VERSION.aab"
          (cd dist && sha256sum quietinbox-*.apk quietinbox-*.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish release with the APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES=$(awk -v ver="${TAG#v}" '/^## \[/{p = index($0, "[" ver "]") > 0} p' CHANGELOG.md)
          [ -n "$NOTES" ] || NOTES="QuietInbox $TAG — see CHANGELOG.md"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete-asset "$TAG" "quietinbox-${TAG#v}.apk" --yes || true
          gh release create "$TAG" dist/quietinbox-*.apk dist/SHA256SUMS.txt --title "QuietInbox $TAG" --notes "$NOTES" 2>/dev/null \
            || gh release upload "$TAG" dist/quietinbox-*.apk dist/SHA256SUMS.txt --clobber

  google-play:
    name: Google Play (${{ inputs.track || 'internal' }})
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
      - name: Upload AAB
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.quietinbox.app
          releaseFiles: dist/quietinbox-${{ needs.build.outputs.version }}.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: src/fastlane/whatsnew
